<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Shapes</title>
    <meta
      name="description"
      content="Twelve shapes. Swipe through them, tap to see the name."
    />
    <meta
      name="theme-color"
      content="#fff2dc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1d1a13"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23ffd400'/%3E%3Cpath d='M50 18 L82 76 H18 Z' fill='none' stroke='%2314120e' stroke-width='9' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="sr-only">Shapes</h1>

      <!-- Every card is rendered once and never re-rendered. Moving through the
           deck only changes each card's position class, so the browser is only
           ever interpolating transform and opacity — nothing swaps content
           underneath you, which is what made the old build flash. -->
      <div class="deck" id="deck"></div>

      <nav class="controls" aria-label="Shapes">
        <button
          class="btn btn-flip"
          type="button"
          data-flip
          aria-controls="deck"
          aria-expanded="false"
        >
          <span data-flip-label>Show name</span>
        </button>
      </nav>

      <ol class="dots" id="dots" aria-hidden="true"></ol>
    </main>

    <p class="sr-only" role="status" aria-live="polite" id="live"></p>

    <script src="decks.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
